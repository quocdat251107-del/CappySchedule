plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.cappy.schedule'
version = '1.0.2'
description = 'CappySchedule - Automated Mob Spawning Scheduler with Timezone support'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    mavenCentral()
    // Spigot & BungeeCord Repo
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    // PaperMC Repo
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    // MythicMobs Repo
    maven {
        name = 'lumine'
        url = 'https://mvn.lumine.io/repository/maven-public/'
    }
    // JitPack Repo
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Spigot API - supports 1.20.x up to 1.21.x
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    
    // MythicMobs API (Soft dependency)
    compileOnly 'io.lumine:Mythic-Dist:5.6.1'
    
    // JetBrains Annotations
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("CappySchedule-${project.version}.jar")
}

build.dependsOn shadowJar
